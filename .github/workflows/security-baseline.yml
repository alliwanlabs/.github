name: Security baseline

# Shared security checks for every Al Liwan Labs repository that holds code (suite plan item 1.1,
# Phase 1: free tools only, no CodeQL and no GitHub Code Security).
#
# A repository calls this workflow from a small caller, for example:
#
#   jobs:
#     baseline:
#       uses: alliwanlabs/.github/.github/workflows/security-baseline.yml@main
#       secrets:
#         scan-status-app-key: ${{ secrets.LABS_SCAN_STATUS_APP_KEY }}
#
# Light scans run on every pull request, on schedule and on manual runs (a push to the default branch
# already passed them as a pull request; gitleaks still runs on every push): gitleaks (secrets, whole
# history), osv-scanner (known vulnerabilities in lockfiles), Semgrep Community rules (p/default) and
# a Trivy filesystem scan (vulnerabilities and misconfiguration). Heavy scans (image build, Trivy
# image scan and a CycloneDX SBOM uploaded as an artifact) run only when the repository has a
# Dockerfile, and then only on a push to the default branch, on schedule or manual runs, and on pull
# requests that change a Dockerfile, a manifest or a lockfile.
#
# The image scan runs on the self-hosted Spark scan runner when one is online for the repository, and
# on GitHub-hosted otherwise or when Spark stalls; it is never skipped. The scan-status-app-key secret
# lets the plan job check the Spark runners; without it the scan runs on GitHub-hosted. Procedure and
# overrides: docs/scan-runner.md in alliwanlabs/.github.
#
# Every scanner is a released binary or image pinned by version and SHA-256, checked before it runs.
# gitleaks/gitleaks-action is not used: it refuses to run on an organisation repository without a
# paid licence. The only actions used are actions/checkout and actions/upload-artifact, pinned by
# commit SHA. Pins verified against the upstream release checksums on 21 October 2026.
#
# On a self-hosted runner with a persistent, marked cache directory, the image job reuses the pinned
# Trivy archive and the Trivy vulnerability DB between jobs. A cached archive is checked against the
# same pinned SHA-256 before every run. See "Install Trivy" in the image job.

on:
  workflow_call:
    inputs:
      path:
        description: Directory the osv-scanner, Semgrep and Trivy filesystem scans read, relative to the repository root.
        type: string
        default: "."
      gitleaks:
        description: Run the gitleaks secret scan.
        type: boolean
        default: true
      gitleaks-config:
        description: gitleaks config file. Empty uses .gitleaks.toml when the repository has one, else the default rules.
        type: string
        default: ""
      osv:
        description: Run osv-scanner on lockfiles.
        type: boolean
        default: true
      semgrep:
        description: Run Semgrep Community rules.
        type: boolean
        default: true
      semgrep-config:
        description: Semgrep rule set or config path.
        type: string
        default: p/default
      semgrep-exclude-rules:
        description: Semgrep rule IDs to skip, one per line. The default skips a Python 3.7 compatibility rule that is not a security check.
        type: string
        default: python.lang.compatibility.python37.python37-compatibility-importlib2
      semgrep-severity:
        description: Lowest Semgrep severity that fails the check (INFO, WARNING or ERROR).
        type: string
        default: ERROR
      trivy-fs:
        description: Run the Trivy filesystem scan.
        type: boolean
        default: true
      image:
        description: Build the image and run the Trivy image scan and SBOM when a Dockerfile exists.
        type: boolean
        default: true
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        type: string
        default: Dockerfile
      docker-context:
        description: Docker build context, relative to the repository root.
        type: string
        default: "."
      docker-build-args:
        description: Extra build arguments, one KEY=VALUE per line. Never put secrets here.
        type: string
        default: ""
      heavy:
        description: When to run the heavy scans. auto, always or never.
        type: string
        default: auto
      severity:
        description: Trivy severities that fail the check.
        type: string
        default: HIGH,CRITICAL
      runner:
        description: Runner label for every job. A self-hosted label avoids billed GitHub-hosted minutes.
        type: string
        default: ubuntu-latest
      heavy-runner:
        description: >-
          Where the image scan runs. Empty uses the organisation or repository variable LABS_SCAN_RUNNER, and when
          that is empty too, auto. auto: Spark when a Spark scan runner is online for this repository, else
          GitHub-hosted. spark: Spark without the runner check (a stall still falls back to GitHub-hosted).
          hosted, or a runner label as plain text or JSON (a string or a list): that runner, never Spark.
        type: string
        default: ""
      spark-build-minutes:
        description: Minutes the image build may take on Spark before the scan moves to GitHub-hosted (at most 30).
        type: number
        default: 15
      sbom-artifact-name:
        description: Name of the uploaded SBOM artifact.
        type: string
        default: sbom
    secrets:
      scan-status-app-key:
        description: >-
          Private key of the runner-status GitHub App (organisation secret LABS_SCAN_STATUS_APP_KEY; its App ID is the
          variable LABS_SCAN_STATUS_APP_ID). Lets the plan job check whether a Spark runner is online. Without it,
          auto places the image scan on GitHub-hosted.
        required: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  TRIVY_VERSION: 0.76.0
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
  TRIVY_ARM64_SHA256: aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c
  # semgrep/semgrep:1.180.0, multi-architecture index digest.
  SEMGREP_IMAGE: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3

jobs:
  plan:
    name: Plan
    if: inputs.image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      placement: ${{ steps.runner.outputs.placement }}
      placement-reason: ${{ steps.runner.outputs.placement-reason }}
      spark-runner: ${{ steps.runner.outputs.spark-runner }}
      hosted-runner: ${{ steps.runner.outputs.hosted-runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which scans run
        id: plan
        env:
          MODE: ${{ inputs.heavy }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "$DOCKERFILE" ]; then dockerfile=true; else dockerfile=false; fi

          # Dockerfiles, manifests and lockfiles: a change to any of them can change the image.
          pattern='(^|/)(Dockerfile[^/]*|\.dockerignore|package\.json|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|requirements[^/]*\.(txt|lock)|[^/]*\.lock|pyproject\.toml|pylock[^/]*\.toml|go\.(mod|sum))$'
          case "$MODE" in
            always) heavy=true ;;
            never) heavy=false ;;
            auto)
              case "$EVENT" in
                pull_request|pull_request_target)
                  if gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' | grep -Eq "$pattern"; then
                    heavy=true
                  else
                    heavy=false
                  fi
                  ;;
                push)
                  if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then heavy=true; else heavy=false; fi
                  ;;
                *) heavy=true ;;
              esac
              ;;
            *) echo "::error::heavy must be auto, always or never, not '$MODE'"; exit 1 ;;
          esac

          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "Event $EVENT on $REF. Dockerfile present: $dockerfile. Heavy scans: $heavy." >> "$GITHUB_STEP_SUMMARY"
      - name: Choose the scan runner
        # Decides where the image scan runs, before any job waits for a runner: a job queued for a self-hosted
        # label that no online runner carries waits for hours and cannot time out, so this check comes first.
        #
        # - heavy-runner input, else LABS_SCAN_RUNNER: empty or "auto" checks the Spark runners (below);
        #   "spark" uses Spark without the check (the step timeouts still hand a stall to GitHub-hosted, but a
        #   job queued with no runner online is not covered); anything else ("hosted", "ubuntu-latest", a JSON
        #   label or list) skips Spark and scans on that runner, "hosted" meaning ubuntu-latest.
        # - auto: with the runner-status App (variable LABS_SCAN_STATUS_APP_ID and the scan-status-app-key
        #   secret), it mints a token that can only read self-hosted runners and runner groups, and picks Spark
        #   when a runner with every Spark label is online in a runner group this repository may use. Missing
        #   credentials, an API error, or no such runner after three looks 20 seconds apart: GitHub-hosted.
        #   Every doubt falls toward the GitHub-hosted scan, never toward skipping it.
        id: runner
        if: steps.plan.outputs.heavy == 'true' && steps.plan.outputs.dockerfile == 'true'
        env:
          OVERRIDE: ${{ inputs.heavy-runner != '' && inputs.heavy-runner || vars.LABS_SCAN_RUNNER }}
          SPARK_LABELS: '["self-hosted","spark","scan"]'
          APP_ID: ${{ vars.LABS_SCAN_STATUS_APP_ID }}
          APP_KEY: ${{ secrets.scan-status-app-key }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          spark_runner="$SPARK_LABELS"
          hosted_runner='"ubuntu-latest"'
          mode=auto
          compact="$(printf '%s' "$OVERRIDE" | tr -d ' \n')"
          case "$compact" in
            ''|auto|'"auto"') mode=auto ;;
            spark|'"spark"'|"$SPARK_LABELS") mode=spark ;;
            hosted|'"hosted"') mode=hosted ;;
            '['*|'"'*) mode=hosted; hosted_runner="$compact" ;;
            *) mode=hosted; hosted_runner="\"$compact\"" ;;
          esac

          placement=hosted
          reason=""
          case "$mode" in
            spark) placement=spark; reason="LABS_SCAN_RUNNER or heavy-runner is spark (no runner check)" ;;
            hosted) reason="LABS_SCAN_RUNNER or heavy-runner chose $hosted_runner" ;;
            auto)
              if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
                reason="no runner-status credentials (LABS_SCAN_STATUS_APP_ID and the scan-status-app-key secret), so Spark cannot be checked"
              else
                # A token from the runner-status App, limited to reading self-hosted runners.
                b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
                token=""
                key="$(mktemp)"
                printf '%s\n' "$APP_KEY" > "$key"
                now="$(date +%s)"
                jwt_head="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
                jwt_body="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 300))" "$APP_ID" | b64url)"
                if sig="$(printf '%s.%s' "$jwt_head" "$jwt_body" | openssl dgst -sha256 -sign "$key" -binary | b64url)"; then
                  jwt="$jwt_head.$jwt_body.$sig"
                  inst="$(curl -fsS --max-time 20 -H "Authorization: Bearer $jwt" -H 'Accept: application/vnd.github+json' \
                    "$API/orgs/$ORG/installation" | jq -r '.id // empty' || true)"
                  if [ -n "$inst" ]; then
                    token="$(curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $jwt" \
                      -H 'Accept: application/vnd.github+json' "$API/app/installations/$inst/access_tokens" \
                      -d '{"permissions":{"organization_self_hosted_runners":"read"}}' | jq -r '.token // empty' || true)"
                  fi
                fi
                rm -f "$key"
                if [ -z "$token" ]; then
                  reason="the runner-status token could not be created, so Spark cannot be checked"
                else
                  echo "::add-mask::$token"
                  # Prints the number of online Spark runners this repository may use, or fails.
                  usable() {
                    local groups gid vis n allowed
                    groups="$(GH_TOKEN="$token" gh api --paginate "orgs/$ORG/actions/runner-groups?per_page=100" \
                      --jq '.runner_groups[] | "\(.id) \(.visibility)"')" || return 1
                    total=0
                    while read -r gid vis; do
                      [ -n "$gid" ] || continue
                      n="$(GH_TOKEN="$token" gh api --paginate "orgs/$ORG/actions/runner-groups/$gid/runners?per_page=100" \
                        --jq ".runners[] | select(.status == \"online\") | select([.labels[].name] as \$have | $SPARK_LABELS | all(. as \$l | \$have | any(. == \$l))) | .name" \
                        | wc -l)" || return 1
                      [ "$n" -gt 0 ] || continue
                      case "$vis" in
                        all|private) allowed=yes ;;
                        selected)
                          if GH_TOKEN="$token" gh api --paginate "orgs/$ORG/actions/runner-groups/$gid/repositories?per_page=100" \
                              --jq '.repositories[].full_name' | grep -Fxq "$REPO"; then allowed=yes; else allowed=no; fi ;;
                        *) allowed=no ;;
                      esac
                      if [ "$allowed" = yes ]; then total=$((total + n)); fi
                    done <<< "$groups"
                    echo "$total"
                  }
                  online=""
                  for look in 1 2 3; do
                    if online="$(usable)"; then
                      if [ "$online" -gt 0 ]; then break; fi
                    else
                      online=error
                      break
                    fi
                    if [ "$look" -lt 3 ]; then sleep 20; fi
                  done
                  if [ "$online" = error ]; then
                    reason="the runner-status API failed, so Spark cannot be checked"
                  elif [ "$online" -gt 0 ]; then
                    placement=spark
                    reason="$online Spark runner(s) online for this repository"
                  else
                    reason="no Spark runner is online in a runner group this repository may use"
                    echo "::warning title=Scan runner offline::No Spark scan runner is online in a runner group $REPO may use; the image is scanned on GitHub-hosted."
                  fi
                fi
              fi
              ;;
          esac

          {
            echo "placement=$placement"
            echo "placement-reason=$reason"
            echo "spark-runner=$spark_runner"
            echo "hosted-runner=$hosted_runner"
          } >> "$GITHUB_OUTPUT"
          echo "Image scan placement: $placement ($reason)." >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: Secrets (gitleaks)
    if: inputs.gitleaks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        # A secret that was ever committed stays a finding until it is rotated and allowlisted with a
        # reason in .gitleaks.toml.
        env:
          CONFIG: ${{ inputs.gitleaks-config }}
        run: |
          set -euo pipefail
          if [ -z "$CONFIG" ] && [ -f .gitleaks.toml ]; then CONFIG=.gitleaks.toml; fi
          if [ -z "$CONFIG" ]; then
            # Org default: the standard rules, plus the one false positive every app with a vendored
            # kit copy shares. VENDORED.json lists SHA-256 hashes of the vendored files.
            CONFIG="$RUNNER_TEMP/gitleaks.toml"
            cat > "$CONFIG" <<'TOML'
          [extend]
          useDefault = true

          [[allowlists]]
          description = "VENDORED.json lists SHA-256 hashes of vendored kit files, not credentials"
          condition = "AND"
          paths = ['(^|/)VENDORED\.json$']
          regexTarget = "secret"
          regexes = ['^[0-9a-f]{64}$']
          TOML
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --config "$CONFIG" .

  osv:
    name: Dependencies (osv-scanner)
    if: inputs.osv && github.event_name != 'push'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan lockfiles
        # Reads every lockfile under the path. Ignores, with a reason and an expiry, go in
        # osv-scanner.toml next to the lockfile. A repository with no lockfile passes.
        env:
          SCAN_PATH: ${{ inputs.path }}
        # --no-resolve keeps the scan to versions written in the repository: resolving a version range
        # in a requirements file picks a version that may never be installed.
        run: '"$RUNNER_TEMP/osv-scanner" scan source --recursive --allow-no-lockfiles --no-resolve "$SCAN_PATH"'

  semgrep:
    name: Static analysis (Semgrep)
    if: inputs.semgrep && github.event_name != 'push'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        # Community rules from the public registry; no Semgrep account or token. Findings are
        # suppressed in code with a `nosemgrep: <rule-id>` comment and a reason, or by path in
        # .semgrepignore.
        env:
          SCAN_PATH: ${{ inputs.path }}
          CONFIG: ${{ inputs.semgrep-config }}
          SEVERITY: ${{ inputs.semgrep-severity }}
          EXCLUDE_RULES: ${{ inputs.semgrep-exclude-rules }}
        run: |
          set -euo pipefail
          excludes=()
          while IFS= read -r rule; do
            if [ -n "$rule" ]; then excludes+=(--exclude-rule "$rule"); fi
          done <<< "$EXCLUDE_RULES"
          case "$SEVERITY" in
            INFO) levels=(--severity INFO --severity WARNING --severity ERROR) ;;
            WARNING) levels=(--severity WARNING --severity ERROR) ;;
            ERROR) levels=(--severity ERROR) ;;
            *) echo "::error::semgrep-severity must be INFO, WARNING or ERROR, not '$SEVERITY'"; exit 1 ;;
          esac
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config "$CONFIG" --metrics=off --error "${levels[@]}" "${excludes[@]}" "$SCAN_PATH"

  trivy-fs:
    name: Filesystem (Trivy)
    if: inputs.trivy-fs && github.event_name != 'push'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Scan vulnerabilities and misconfiguration
        # Fails on fixable findings at the listed severities. Ignores, with a reason, go in
        # .trivyignore at the repository root.
        env:
          SCAN_PATH: ${{ inputs.path }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --severity "$SEVERITY" --ignore-unfixed \
            --exit-code 1 "$SCAN_PATH"

  # The image scan runs in up to two jobs, so that a stalled or missing Spark scan runner never blocks a release
  # and never skips the scan:
  #
  # 1. "Image and SBOM (Trivy) on Spark" runs only when the plan job placed the scan on Spark (an online Spark
  #    runner this repository may use, or LABS_SCAN_RUNNER=spark). Every step that can stall on the runner
  #    (checkout, Trivy install, build, SBOM, scan) has a short timeout. A stall or an infrastructure failure
  #    ends the job green with scanned=false and a "scan runner stalled" warning, so the head commit carries no
  #    red or cancelled check run for it. Only a real finding (Trivy exit code 13) fails this job.
  # 2. "Image and SBOM (Trivy)" always runs when the image is due, on a GitHub-hosted runner (or the override).
  #    It is the verdict: when Spark scanned, it records that and finishes in seconds; when Spark found
  #    HIGH/CRITICAL vulnerabilities, it fails; otherwise (Spark not used, stalled or failed) it builds and
  #    scans the image itself. Its name is the one the check had before, so consumers keep reading it.
  image-spark:
    name: Image and SBOM (Trivy) on Spark
    needs: plan
    if: inputs.image && needs.plan.outputs.dockerfile == 'true' && needs.plan.outputs.heavy == 'true' && needs.plan.outputs.placement == 'spark'
    runs-on: ${{ fromJSON(needs.plan.outputs.spark-runner) }}
    # Above the sum of the step timeouts below (with spark-build-minutes at most 30), so a step that stalls ends at
    # its own timeout, never at this one: a job timeout would leave a cancelled check run.
    timeout-minutes: 80
    permissions:
      contents: read
    outputs:
      scanned: ${{ steps.result.outputs.scanned }}
      findings: ${{ steps.scan.outputs.findings }}
      stalled-at: ${{ steps.result.outputs.stalled-at }}
    env:
      # Unique per run: a self-hosted runner keeps images between jobs.
      IMAGE: security-baseline-${{ github.run_id }}-${{ github.run_attempt }}:scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install Trivy
        id: install
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        # Runner cache (self-hosted only). The job reuses the pinned Trivy archive and the vulnerability DB
        # from a persistent per-runner directory, so a slow github.com or mirror.gcr.io costs one download
        # per runner, not one per job.
        #
        # - The cache is used only on a self-hosted runner whose cache root exists, is writable and holds a
        #   `.persistent` marker. The root is $LABS_SCAN_CACHE when the runner sets it, else
        #   ${RUNNER_TOOL_CACHE:-$HOME/.cache}/labs-scan. The marker is placed by whoever mounts the volume,
        #   so an ephemeral runner (a container thrown away after each job) never writes a cache that dies
        #   with it. Hosted runners, and self-hosted runners without the marker, behave exactly as before.
        # - Binary: <root>/trivy/<version>/<archive>. A cached archive is copied into RUNNER_TEMP and the
        #   copy is checked against the pinned SHA-256 before it is unpacked, as a download is; a copy that
        #   does not match is discarded and the archive is downloaded. A verified download is saved to the
        #   cache through a temp file and mv, so a reader never sees a half-written archive.
        # - DB: <root>/trivy-cache, passed to every trivy call as TRIVY_CACHE_DIR. DB updates stay on:
        #   Trivy downloads a new DB only when the cached one's NextUpdate time has passed. Each trivy call
        #   holds an exclusive flock on <root>/trivy-cache.lock, so two jobs on one host cannot write the DB
        #   at once. TRIVY_CACHE_BACKEND=memory keeps per-image layer results out of the persistent
        #   directory, so it holds only the DBs and does not grow with every scanned image.
        # - Trust: the DB is not signed by Trivy, so a job that can write the cache volume could alter it.
        #   Only repositories in the runner group can run there; the binary stays verified on every run.
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          # The Spark runner is ARM64; GitHub-hosted runners are x64.
          case "$(uname -m)" in
            x86_64) archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; sum="$TRIVY_SHA256" ;;
            aarch64|arm64) archive="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; sum="$TRIVY_ARM64_SHA256" ;;
            *) echo "::error::no pinned Trivy build for $(uname -m)"; exit 1 ;;
          esac

          cache=""
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            root="${LABS_SCAN_CACHE:-${RUNNER_TOOL_CACHE:-$HOME/.cache}/labs-scan}"
            if [ -f "$root/.persistent" ] && [ -w "$root" ]; then cache="$root"; fi
          fi

          bin="$RUNNER_TEMP/$archive"
          source=download
          if [ -n "$cache" ]; then
            cached="$cache/trivy/$TRIVY_VERSION/$archive"
            if [ -f "$cached" ]; then
              cp "$cached" "$bin"
              if echo "${sum}  ${bin}" | sha256sum -c --status -; then
                source=cache
              else
                echo "::warning::cached Trivy archive does not match the pinned SHA-256; downloading it again"
                rm -f "$bin"
              fi
            fi
          fi
          if [ "$source" = download ]; then
            curl -fsSL -o "$bin" \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          fi
          # Checks the file that is unpacked, whichever source it came from.
          echo "${sum}  ${bin}" | sha256sum -c -
          tar -xzf "$bin" -C "$RUNNER_TEMP" trivy

          if [ -n "$cache" ]; then
            if [ "$source" = download ]; then
              mkdir -p "$(dirname "$cached")"
              tmp="$(mktemp "$(dirname "$cached")/.${archive}.XXXXXX")"
              cp "$bin" "$tmp"
              mv -f "$tmp" "$cached"
            fi
            mkdir -p "$cache/trivy-cache"
            {
              echo "TRIVY_CACHE_DIR=$cache/trivy-cache"
              echo "TRIVY_CACHE_BACKEND=memory"
              echo "LABS_TRIVY_LOCK=$cache/trivy-cache.lock"
            } >> "$GITHUB_ENV"
            echo "Trivy ${TRIVY_VERSION}: binary from the ${source}; vulnerability DB cached in $cache/trivy-cache." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trivy ${TRIVY_VERSION}: no runner cache; binary and vulnerability DB downloaded for this job." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the image
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: ${{ inputs.spark-build-minutes }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.docker-context }}
          BUILD_ARGS: ${{ inputs.docker-build-args }}
          # A self-hosted runner may start jobs without a usable TMPDIR; podman and bash both need one.
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          args=(build --pull -t "$IMAGE" -f "$DOCKERFILE")
          while IFS= read -r line; do
            if [ -n "$line" ]; then args+=(--build-arg "$line"); fi
          done < <(printf '%s\n' "$BUILD_ARGS")
          docker "${args[@]}" "$CONTEXT"
          # Trivy reads the saved archive, so it works whether the runner's docker is Docker or podman.
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE"
      - name: Record the scanned platform
        if: steps.build.outcome == 'success'
        # The Spark runner builds linux/arm64 with no x86 emulation, so there the SBOM and the image scan
        # describe the arm64 variant of the image, not the amd64 image that is deployed. The base packages
        # are the same in practice; architecture-specific wheels or binaries can differ.
        run: |
          echo "Image built and scanned on $(uname -m) (runner arch $RUNNER_ARCH). The SBOM describes that platform." \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Write the SBOM
        id: sbom
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # With the runner cache on, wait up to 10 minutes for another job's trivy call to finish.
          lock=()
          if [ -n "${LABS_TRIVY_LOCK:-}" ]; then lock=(flock --wait 600 "$LABS_TRIVY_LOCK"); fi
          "${lock[@]}" "$RUNNER_TEMP/trivy" image --skip-version-check --format cyclonedx \
            --output "$RUNNER_TEMP/sbom.cdx.json" --input "$RUNNER_TEMP/image.tar"
      - name: Upload the SBOM
        id: upload
        if: steps.sbom.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.sbom-artifact-name }}
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan the image
        id: scan
        if: steps.upload.outcome == 'success'
        # Runs after the SBOM upload, so a failing scan still leaves the SBOM behind. Trivy exits 13 on findings
        # and 1 on its own errors, so the two are told apart: findings fail the job, anything else (including
        # the 12-minute stall timeout, exit 124) hands the scan to the GitHub-hosted job. No continue-on-error
        # here, and the step timeout sits above the shell timeout, so a finding is never swallowed.
        timeout-minutes: 15
        env:
          SEVERITY: ${{ inputs.severity }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -uo pipefail
          lock=()
          if [ -n "${LABS_TRIVY_LOCK:-}" ]; then lock=(flock --wait 600 "$LABS_TRIVY_LOCK"); fi
          timeout 720 "${lock[@]}" "$RUNNER_TEMP/trivy" image --skip-version-check --scanners vuln \
            --severity "$SEVERITY" --ignore-unfixed --exit-code 13 --input "$RUNNER_TEMP/image.tar"
          rc=$?
          case "$rc" in
            0) echo "findings=false" >> "$GITHUB_OUTPUT"; echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
            13)
              echo "findings=true" >> "$GITHUB_OUTPUT"
              echo "::error::Trivy found fixable $SEVERITY vulnerabilities in the image (listed above)."
              exit 1
              ;;
            *)
              echo "findings=false" >> "$GITHUB_OUTPUT"
              echo "verdict=none" >> "$GITHUB_OUTPUT"
              echo "::warning::Trivy did not finish on this runner (exit $rc; 124 is the 12-minute timeout)."
              ;;
          esac
      - name: Hand over or keep the result
        id: result
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          if [ "$SCAN" = success ] && [ "$VERDICT" = pass ]; then
            echo "scanned=true" >> "$GITHUB_OUTPUT"
            echo "Image scanned on the Spark runner $RUNNER. No GitHub-hosted scan is needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SCAN" = failure ]; then
            # A finding: the job fails at the scan step, and the verdict job fails too.
            echo "scanned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          at=scan
          for pair in "checkout:$CHECKOUT" "Trivy install:$INSTALL" "build:$BUILD" "SBOM:$SBOM" "SBOM upload:$UPLOAD"; do
            if [ "${pair##*:}" != success ]; then at="${pair%:*}"; break; fi
          done
          echo "scanned=false" >> "$GITHUB_OUTPUT"
          echo "stalled-at=$at" >> "$GITHUB_OUTPUT"
          msg="Scan runner stalled or failed at the $at step on $RUNNER. This is the runner, not the code: the image is scanned on GitHub-hosted instead, in the job \"Image and SBOM (Trivy)\"."
          echo "::warning title=Scan runner stalled::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the image
        if: always()
        run: |
          docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/image.tar"

  image:
    name: Image and SBOM (Trivy)
    needs: [plan, image-spark]
    # always() so it runs after a skipped or failed Spark job; !cancelled() so a cancelled run stays cancelled.
    if: >-
      always() && !cancelled() && inputs.image && needs.plan.result == 'success'
      && needs.plan.outputs.dockerfile == 'true' && needs.plan.outputs.heavy == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.hosted-runner) }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      IMAGE: security-baseline-${{ github.run_id }}-${{ github.run_attempt }}-hosted:scan
    steps:
      - name: Decide whether this job scans
        id: decide
        env:
          PLACEMENT: ${{ needs.plan.outputs.placement }}
          REASON: ${{ needs.plan.outputs.placement-reason }}
          SPARK_RESULT: ${{ needs.image-spark.result }}
          SPARK_SCANNED: ${{ needs.image-spark.outputs.scanned }}
          SPARK_FINDINGS: ${{ needs.image-spark.outputs.findings }}
          STALLED_AT: ${{ needs.image-spark.outputs.stalled-at }}
        run: |
          set -euo pipefail
          if [ "$SPARK_FINDINGS" = true ]; then
            echo "::error::The image scan on Spark found fixable vulnerabilities; see the job \"Image and SBOM (Trivy) on Spark\"."
            exit 1
          fi
          if [ "$SPARK_RESULT" = success ] && [ "$SPARK_SCANNED" = true ]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "The image was scanned on Spark and passed. This job only records the verdict." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "scan=true" >> "$GITHUB_OUTPUT"
          if [ "$PLACEMENT" = spark ]; then
            why="the Spark job ended with ${SPARK_RESULT:-no result}${STALLED_AT:+ (stalled at the $STALLED_AT step)}"
            echo "::warning title=Scan runner stalled::Spark did not scan the image: $why. Scanning on this runner instead."
          else
            why="$REASON"
          fi
          echo "Scanning on $RUNNER_NAME ($RUNNER_ENVIRONMENT): $why." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.scan == 'true'
        timeout-minutes: 10
        with:
          persist-credentials: false
      - name: Install Trivy
        if: steps.decide.outputs.scan == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; sum="$TRIVY_SHA256" ;;
            aarch64|arm64) archive="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; sum="$TRIVY_ARM64_SHA256" ;;
            *) echo "::error::no pinned Trivy build for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${sum}  $RUNNER_TEMP/${archive}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Build the image
        if: steps.decide.outputs.scan == 'true'
        timeout-minutes: 20
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.docker-context }}
          BUILD_ARGS: ${{ inputs.docker-build-args }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          args=(build --pull -t "$IMAGE" -f "$DOCKERFILE")
          while IFS= read -r line; do
            if [ -n "$line" ]; then args+=(--build-arg "$line"); fi
          done < <(printf '%s\n' "$BUILD_ARGS")
          docker "${args[@]}" "$CONTEXT"
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE"
          echo "Image built and scanned on $(uname -m) (runner arch $RUNNER_ARCH). The SBOM describes that platform." \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Write the SBOM
        if: steps.decide.outputs.scan == 'true'
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/trivy" image --skip-version-check --format cyclonedx \
            --output "$RUNNER_TEMP/sbom.cdx.json" --input "$RUNNER_TEMP/image.tar"
      - name: Upload the SBOM
        if: steps.decide.outputs.scan == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.sbom-artifact-name }}
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
          # The Spark job may have uploaded an SBOM before it stalled at the scan step; this one replaces it.
          overwrite: true
      - name: Scan the image
        if: steps.decide.outputs.scan == 'true'
        timeout-minutes: 15
        env:
          SEVERITY: ${{ inputs.severity }}
          TMPDIR: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/trivy" image --skip-version-check --scanners vuln --severity "$SEVERITY" \
            --ignore-unfixed --exit-code 1 --input "$RUNNER_TEMP/image.tar"
      - name: Remove the image
        if: always() && steps.decide.outputs.scan == 'true'
        run: |
          docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/image.tar"
